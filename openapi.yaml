openapi: 3.0.3
info:
  title: Kinloop API
  version: 1.0.0
  description: OpenAPI specification for Kinloop backend (generated from controllers and DTOs)
servers:
  - url: https://kinloop-be.onrender.com
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ChildId:
      name: childId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ConsentId:
      name: consentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    DailyPlanItemId:
      name: dailyPlanItemId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    UserRole:
      type: string
      enum: [PARENT, WORKSHOP, ADMIN]
    QuestionType:
      type: string
      enum: [SINGLE_CHOICE, MULTI_CHOICE, SCALE, FREE_TEXT, DATE]
    SessionStatus:
      type: string
      enum: [IN_PROGRESS, COMPLETED, ABANDONED]
    AgeBand:
      type: string
      enum: [BAND_0_12, BAND_12_24, BAND_24_48, BAND_48_72]
    Gender:
      type: string
      enum: [FEMALE, MALE, OTHER, UNDISCLOSED]
    TriggerReason:
      type: string
      enum: [INITIAL, AGE_BAND, MANUAL]
    FeedbackType:
      type: string
      enum: [LIKED, STRUGGLED, DISLIKED]
    FeedbackReason:
      type: string
      enum: [SENSORY, INVOLVEMENT, INTEREST]
    ConsentType:
      type: string
      enum: [TERMS, PRIVACY, KVKK, MARKETING, DATA_PROCESSING]
    DevelopmentDomain:
      type: string
      enum: [GROSS_MOTOR, FINE_MOTOR, LANGUAGE, SOCIAL_EMOTIONAL, COGNITIVE, SENSORY, SELF_REGULATION]
    InvolvementType:
      type: string
      enum: [BIRLIKTE, GOZETIMLI, BAGIMSIZ]
    PreferenceMode:
      type: string
      enum: [BALANCED, KEYIF, GELISIM]
    IntelligenceType:
      type: string
      enum: [VERBAL_LINGUISTIC, LOGICAL_MATHEMATICAL, VISUAL_SPATIAL,
             BODILY_KINAESTHETIC, MUSICAL, INTERPERSONAL, INTRAPERSONAL, NATURALISTIC]

    HomeStatusResponse:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [new-user, half-onboarding-user, feedback-required, returning-user]
        childId:
          type: integer
          format: int64
        childName:
          type: string
        child:
          $ref: '#/components/schemas/HomeChildResponse'
        onboardingStep:
          type: string
          enum: [DAILY_TIME_BUDGET, QUESTIONNAIRE, CONSENTS]
        nextQuestionCode:
          type: string
          description: First unanswered required questionnaire question when onboardingStep is QUESTIONNAIRE.
        nextConsentId:
          type: integer
          format: int64
          description: First active required consent not yet granted when onboardingStep is CONSENTS.
        latestActivity:
          $ref: '#/components/schemas/HomeActivityResponse'
        shouldGenerateDailyPlan:
          type: boolean
          description: When true, calling /today will generate a new daily-plan round.
        shouldListExistingPlan:
          type: boolean
          description: When true, calling /today will return the existing unfinished daily-plan round.

    HomeChildResponse:
      type: object
      required: [childId, displayName, birthDate, ageMonths, ageBand]
      properties:
        childId:
          type: integer
          format: int64
        fullName:
          type: string
        displayName:
          type: string
        birthDate:
          type: string
          format: date
        ageMonths:
          type: integer
        ageBand:
          $ref: '#/components/schemas/AgeBand'
        gender:
          $ref: '#/components/schemas/Gender'

    HomeActivityResponse:
      type: object
      required: [dailyPlanItemId, activityId, title, durationMinutes, slotType, feedbackSubmitted]
      properties:
        dailyPlanItemId:
          type: integer
          format: int64
        activityId:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
        slotType:
          type: string
          enum: [STRENGTHEN, DEVELOP, EXPLORE]
        intro:
          type: string
        purpose:
          type: string
        whyItMatters:
          type: string
        easierVariation:
          type: string
        harderVariation:
          type: string
        observationTip:
          type: string
        selectedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        feedbackSubmitted:
          type: boolean
        feedback:
          $ref: '#/components/schemas/HomeFeedbackResponse'

    HomeFeedbackResponse:
      type: object
      required: [feedbackId, feedbackType]
      properties:
        feedbackId:
          type: integer
          format: int64
        feedbackType:
          $ref: '#/components/schemas/FeedbackType'
        resolvedReason:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/FeedbackReason'
        freeText:
          type: string
        createdAt:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          $ref: '#/components/schemas/UserRole'

    RegisterResponse:
      type: object
      properties:
        message:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        deviceLabel:
          type: string

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        userId:
          type: integer
          format: int64
        emailVerified:
          type: boolean

    CreateChildRequest:
      type: object
      properties:
        fullName:
          type: string
          maxLength: 255
        birthDate:
          type: string
          format: date
        gender:
          $ref: '#/components/schemas/Gender'
      required: [birthDate]

    UpdateChildRequest:
      allOf:
        - $ref: '#/components/schemas/CreateChildRequest'

    UpdateChildResponse:
      type: object
      required: [childId, displayName, birthDate, ageMonths, ageBand, questionnaireRestarted]
      properties:
        childId:
          type: integer
          format: int64
        fullName:
          type: string
        displayName:
          type: string
        birthDate:
          type: string
          format: date
        ageMonths:
          type: integer
        ageBand:
          $ref: '#/components/schemas/AgeBand'
        gender:
          $ref: '#/components/schemas/Gender'
        questionnaireRestarted:
          type: boolean
          description: True when a corrected birth date changes the age band and a new questionnaire is required.

    DailyTimeBudgetOptionResponse:
      type: object
      required: [code, label, displayOrder, minMinutes, maxMinutes]
      properties:
        code:
          type: string
          enum: [A, B, C]
        label:
          type: string
        displayOrder:
          type: integer
        minMinutes:
          type: integer
        maxMinutes:
          type: integer

    DailyTimeBudgetProfileResponse:
      type: object
      required: [questionCode, question, minMinutes, maxMinutes, options]
      properties:
        questionCode:
          type: string
        question:
          type: string
        selectedOptionCode:
          type: string
          enum: [A, B, C]
          description: Null until the parent explicitly submits this step; stored defaults are not progress.
        minMinutes:
          type: integer
        maxMinutes:
          type: integer
        options:
          type: array
          description: A/B below 24 months; A/B/C from 24 months.
          items:
            $ref: '#/components/schemas/DailyTimeBudgetOptionResponse'

    UpdateDailyTimeBudgetRequest:
      type: object
      required: [optionCode]
      properties:
        optionCode:
          type: string
          enum: [A, B, C]

    DailyTimeBudgetResponse:
      type: object
      required: [answeredOptionCode, minMinutes, maxMinutes]
      properties:
        answeredOptionCode:
          type: string
          enum: [A, B, C]
        minMinutes:
          type: integer
        maxMinutes:
          type: integer

    OnboardingClosingAction:
      type: string
      enum: [START, REMIND_LATER]

    UpdateOnboardingClosingMessageRequest:
      type: object
      required: [action]
      properties:
        action:
          $ref: '#/components/schemas/OnboardingClosingAction'

    OnboardingClosingMessageResponse:
      type: object
      required: [shouldDisplay, planReminderEnabled, reminderPlansRemaining]
      properties:
        shouldDisplay:
          type: boolean
          description: True after questionnaire completion until the first response.
        planReminderEnabled:
          type: boolean
          description: True while REMIND_LATER covers one of the next three generated plans.
        reminderPlansRemaining:
          type: integer
          minimum: 0
          maximum: 3

    ActivityStepResponse:
      type: object
      required: [stepNo, text]
      properties:
        stepNo:
          type: integer
        text:
          type: string

    ActivityMaterialResponse:
      type: object
      required: [name, optional, displayOrder]
      properties:
        name:
          type: string
        category:
          type: string
        quantity:
          type: string
        optional:
          type: boolean
        displayOrder:
          type: integer
        note:
          type: string

    ActivityOutcomeResponse:
      type: object
      required: [displayOrder, outcome]
      properties:
        displayOrder:
          type: integer
        outcome:
          type: string

    DailyActivityResponse:
      type: object
      required: [dailyPlanItemId, activityId, title, minAgeMonths, maxAgeMonths,
                 targetIntelligence, targetDomain, difficulty, durationMinutes,
                 involvementType, noiseLoad, visualLoad, physicalIntensity, slotType,
                 score, steps, materials, outcomes, withinBudget, repeatNotice,
                 selected, completed]
      properties:
        dailyPlanItemId:
          type: integer
          format: int64
        activityId:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        minAgeMonths:
          type: integer
        maxAgeMonths:
          type: integer
        targetIntelligence:
          $ref: '#/components/schemas/IntelligenceType'
        secondaryIntelligence:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/IntelligenceType'
        targetDomain:
          $ref: '#/components/schemas/DevelopmentDomain'
        difficulty:
          type: integer
        durationMinutes:
          type: integer
        involvementType:
          $ref: '#/components/schemas/InvolvementType'
        noiseLoad:
          type: integer
        visualLoad:
          type: integer
        physicalIntensity:
          type: integer
        slotType:
          type: string
          enum: [STRENGTHEN, DEVELOP, EXPLORE]
        score:
          type: number
        intro:
          type: string
        purpose:
          type: string
        whyItMatters:
          type: string
        easierVariation:
          type: string
        harderVariation:
          type: string
        observationTip:
          type: string
        safetyNotes:
          type: string
        cleanupNotes:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ActivityStepResponse'
        materials:
          type: array
          items:
            $ref: '#/components/schemas/ActivityMaterialResponse'
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/ActivityOutcomeResponse'
        withinBudget:
          type: boolean
        repeatNotice:
          type: boolean
        selected:
          type: boolean
        completed:
          type: boolean
        selectedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time

    DailyPlanResponse:
      type: object
      required: [planId, childId, planDate, budgetMin, budgetMax, committedDurationMinutes,
                 totalDurationMinutes, fallbackLevel, activities, state, showOnboardingReminder]
      properties:
        planId:
          type: integer
          format: int64
        childId:
          type: integer
          format: int64
        planDate:
          type: string
          format: date
        budgetMin:
          type: integer
        budgetMax:
          type: integer
        committedDurationMinutes:
          type: integer
        totalDurationMinutes:
          type: integer
        fallbackLevel:
          type: integer
        activities:
          type: array
          items:
            $ref: '#/components/schemas/DailyActivityResponse'
        state:
          type: string
        message:
          type: string
          nullable: true
        showOnboardingReminder:
          type: boolean
          description: True only for the first three plans generated after REMIND_LATER.

    SessionSummaryResponse:
      type: object
      properties:
        sessionId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/SessionStatus'
        triggerReason:
          $ref: '#/components/schemas/TriggerReason'
        totalQuestions:
          type: integer
        answeredCount:
          type: integer
        nextQuestionCode:
          type: string

    CreateChildResponse:
      type: object
      properties:
        childId:
          type: integer
          format: int64
        fullName:
          type: string
        gender:
          $ref: '#/components/schemas/Gender'
        displayName:
          type: string
        birthDate:
          type: string
          format: date
        ageMonths:
          type: integer
        ageBand:
          $ref: '#/components/schemas/AgeBand'
        session:
          $ref: '#/components/schemas/SessionSummaryResponse'

    IdentityQuestionResponse:
      type: object
      properties:
        code:
          type: string
        displayOrder:
          type: integer
        body:
          type: string
        helperText:
          type: string
          nullable: true
        answerKey:
          type: string
        maxLength:
          type: integer
          nullable: true
        type:
          $ref: '#/components/schemas/QuestionType'
        required:
          type: boolean
        options:
          type: array
          items:
            $ref: '#/components/schemas/QuestionOptionResponse'
        answeredOptionCode:
          type: string
          nullable: true

    IdentityQuestionsResponse:
      type: object
      properties:
        questions:
          type: array
          items:
            $ref: '#/components/schemas/IdentityQuestionResponse'

    QuestionOptionResponse:
      type: object
      properties:
        code:
          type: string
        label:
          type: string
        displayOrder:
          type: integer

    QuestionnaireQuestionResponse:
      type: object
      properties:
        code:
          type: string
        body:
          type: string
        type:
          $ref: '#/components/schemas/QuestionType'
        required:
          type: boolean
        displayOrder:
          type: integer
        options:
          type: array
          items:
            $ref: '#/components/schemas/QuestionOptionResponse'
        answeredOptionCode:
          type: string
          nullable: true

    CurrentQuestionnaireResponse:
      type: object
      properties:
        sessionId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/SessionStatus'
        triggerReason:
          $ref: '#/components/schemas/TriggerReason'
        ageBand:
          $ref: '#/components/schemas/AgeBand'
        ageMonths:
          type: integer
        totalQuestions:
          type: integer
        answeredCount:
          type: integer
        nextQuestionCode:
          type: string
          nullable: true
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionnaireQuestionResponse'

    SubmitAnswerRequest:
      type: object
      required: [optionCode]
      properties:
        optionCode:
          type: string

    QuestionnaireCompleteResponse:
      type: object
      properties:
        sessionId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/SessionStatus'
        snapshotId:
          type: integer
          format: int64
        ageBand:
          $ref: '#/components/schemas/AgeBand'
        ageMonths:
          type: integer

    FeedbackQuestionResponse:
      type: object
      required: [code, body, type, required, displayOrder, options]
      properties:
        code:
          type: string
        body:
          type: string
        helperText:
          type: string
          nullable: true
        type:
          $ref: '#/components/schemas/QuestionType'
        required:
          type: boolean
        displayOrder:
          type: integer
        maxLength:
          type: integer
          nullable: true
        options:
          type: array
          items:
            $ref: '#/components/schemas/QuestionOptionResponse'

    FeedbackQuestionsResponse:
      type: object
      required: [questions]
      properties:
        questions:
          type: array
          items:
            $ref: '#/components/schemas/FeedbackQuestionResponse'

    UpdateConsentRequest:
      type: object
      required: [granted]
      properties:
        granted:
          type: boolean

    ConsentResponse:
      type: object
      required: [consentId, type, version, title, summary, content, required, effectiveAt]
      properties:
        consentId:
          type: integer
          format: int64
        type:
          $ref: '#/components/schemas/ConsentType'
        version:
          type: string
        title:
          type: string
        summary:
          type: string
        content:
          type: string
        required:
          type: boolean
        effectiveAt:
          type: string
          format: date-time
        granted:
          type: boolean
          nullable: true
          description: Null when the authenticated user has not responded to this consent.
        respondedAt:
          type: string
          format: date-time
          nullable: true

    ParentProfileDetailsResponse:
      type: object
      required: [parentProfileId, email, fullName]
      properties:
        parentProfileId:
          type: integer
          format: int64
        email:
          type: string
          format: email
        fullName:
          type: string
        phone:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        district:
          type: string
          nullable: true

    ProfileAnswerResponse:
      type: object
      required: [questionCode, question, questionType, displayOrder, answeredAt]
      properties:
        questionCode:
          type: string
        question:
          type: string
        questionType:
          $ref: '#/components/schemas/QuestionType'
        displayOrder:
          type: integer
        optionCode:
          type: string
          nullable: true
        value:
          type: string
          nullable: true
        displayValue:
          type: string
          nullable: true
        answeredAt:
          type: string
          format: date-time

    ChildProfileResponse:
      type: object
      required: [childId, displayName, birthDate, ageMonths, preferenceMode,
                 dailyTimeBudgetMin, dailyTimeBudgetMax, onboardingAnswers]
      properties:
        childId:
          type: integer
          format: int64
        fullName:
          type: string
          nullable: true
        displayName:
          type: string
        birthDate:
          type: string
          format: date
        ageMonths:
          type: integer
        gender:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Gender'
        preferenceMode:
          $ref: '#/components/schemas/PreferenceMode'
        dailyTimeBudgetMin:
          type: integer
        dailyTimeBudgetMax:
          type: integer
        onboardingCompletedAt:
          type: string
          format: date-time
          nullable: true
        onboardingAnswers:
          type: array
          items:
            $ref: '#/components/schemas/ProfileAnswerResponse'

    ProfileResponse:
      type: object
      required: [parent, children]
      properties:
        parent:
          $ref: '#/components/schemas/ParentProfileDetailsResponse'
        children:
          type: array
          items:
            $ref: '#/components/schemas/ChildProfileResponse'

    ActivityHistoryItemResponse:
      type: object
      required: [dailyPlanItemId, activityId, title, durationMinutes, targetDomain,
                 involvementType, planDate, selectedAt, completed]
      properties:
        dailyPlanItemId:
          type: integer
          format: int64
        activityId:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
          nullable: true
        durationMinutes:
          type: integer
        targetDomain:
          $ref: '#/components/schemas/DevelopmentDomain'
        involvementType:
          $ref: '#/components/schemas/InvolvementType'
        planDate:
          type: string
          format: date
        selectedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        completed:
          type: boolean

    ActivityHistoryResponse:
      type: object
      required: [childId, page, size, hasNext, activities]
      properties:
        childId:
          type: integer
          format: int64
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        hasNext:
          type: boolean
        activities:
          type: array
          items:
            $ref: '#/components/schemas/ActivityHistoryItemResponse'

    SelectDailyActivityRequest:
      type: object
      required: [activityId]
      properties:
        activityId:
          type: integer
          format: int64

    SubmitActivityFeedbackRequest:
      type: object
      required: [feedbackType]
      properties:
        feedbackType:
          $ref: '#/components/schemas/FeedbackType'
        freeText:
          type: string
          maxLength: 500
          nullable: true

    ActivityFeedbackResponse:
      type: object
      required: [feedbackId, dailyPlanItemId, feedbackType, domain, domainLevel, domainStreak]
      properties:
        feedbackId:
          type: integer
          format: int64
        dailyPlanItemId:
          type: integer
          format: int64
        feedbackType:
          $ref: '#/components/schemas/FeedbackType'
        resolvedReason:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/FeedbackReason'
        domain:
          $ref: '#/components/schemas/DevelopmentDomain'
        domainLevel:
          type: integer
        domainStreak:
          type: number

    ApiErrorResponse:
      type: object
      required: [error, status]
      properties:
        error:
          type: string
        status:
          type: integer
        fieldErrors:
          type: object
          nullable: true
          additionalProperties:
            type: string

paths:
  /api/home/status:
    get:
      summary: Get the authenticated parent's home state
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Home state resolved from onboarding, selection, and feedback history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeStatusResponse'
        '401':
          description: Missing, expired, or invalid access token

  /api/home/feedback/questions:
    get:
      summary: Get activity feedback questions and answer options
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active feedback questions in display order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackQuestionsResponse'
        '401':
          description: Missing, expired, or invalid access token

  /api/auth/register:
    post:
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'

  /api/auth/verify:
    get:
      summary: Verify email with token
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/auth/login:
    post:
      summary: Login user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /api/children:
    post:
      summary: Create a child for current parent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChildRequest'
      responses:
        '201':
          description: Child created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChildResponse'

  /api/children/{childId}:
    put:
      summary: Update an owned child's identity details from onboarding or profile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChildId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChildRequest'
      responses:
        '200':
          description: Child updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateChildResponse'
        '404':
          description: Child does not belong to the authenticated parent

  /api/onboarding/identity-questions:
    get:
      summary: Get identity/onboarding questions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Identity questions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityQuestionsResponse'

  /api/children/{childId}/onboarding/daily-time-budget:
    get:
      summary: Get a child's budget range and age-appropriate choices
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChildId'
      responses:
        '200':
          description: Child budget and available choices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyTimeBudgetProfileResponse'
    put:
      summary: Set a child's budget during creation follow-up or re-onboarding
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChildId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDailyTimeBudgetRequest'
      responses:
        '200':
          description: Updated child budget range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyTimeBudgetResponse'
        '400':
          description: Unknown choice, or C selected below 24 months

  /api/children/{childId}/onboarding/closing-message:
    get:
      summary: Get the one-time closing-message and reminder state
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChildId'
      responses:
        '200':
          description: Current closing-message state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingClosingMessageResponse'
    put:
      summary: Record START or REMIND_LATER; the first response wins idempotently
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChildId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOnboardingClosingMessageRequest'
      responses:
        '200':
          description: Updated closing-message state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingClosingMessageResponse'

  /api/consents:
    get:
      summary: Get active consent documents and the authenticated user's decisions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active consents in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsentResponse'
        '401':
          description: Missing, expired, or invalid access token

  /api/consents/{consentId}:
    put:
      summary: Grant or revoke an active consent
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConsentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConsentRequest'
      responses:
        '200':
          description: Updated consent decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentResponse'
        '400':
          description: Validation failed or the active consent was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Missing, expired, or invalid access token

  /api/profile:
    get:
      summary: Get the authenticated parent's profile and children
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Parent profile with child details and onboarding answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          description: Missing, expired, or invalid access token

  /api/children/{childId}/activity-history:
    get:
      summary: Get paginated selected-activity history for an owned child
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChildId'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Slice of selected activities ordered by history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityHistoryResponse'
        '400':
          description: Page or size is outside its allowed range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Missing, expired, or invalid access token
        '404':
          description: Child does not belong to the authenticated parent

  /api/children/{childId}/daily-plan/today:
    get:
      summary: Get or generate today's persisted plan
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChildId'
      responses:
        '200':
          description: Today's plan, including the first-three-plan onboarding reminder flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyPlanResponse'
        '403':
          description: One or more active required consents have not been granted

  /api/children/{childId}/daily-plan/today/selection:
    post:
      summary: Select an activity from today's plan
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChildId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectDailyActivityRequest'
      responses:
        '200':
          description: Daily plan with the selected activity state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyPlanResponse'
        '400':
          description: Validation failed or the activity is not in the daily plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Missing, expired, or invalid access token
        '404':
          description: Child or daily plan was not found

  /api/children/{childId}/daily-plan/items/{dailyPlanItemId}/feedback:
    post:
      summary: Submit feedback for a selected daily-plan activity
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChildId'
        - $ref: '#/components/parameters/DailyPlanItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitActivityFeedbackRequest'
      responses:
        '200':
          description: Persisted feedback and resulting learning state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityFeedbackResponse'
        '400':
          description: Validation failed or the item is not valid for feedback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Missing, expired, or invalid access token
        '404':
          description: Child or daily-plan item was not found
        '409':
          description: Feedback was already submitted for this item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /api/children/{childId}/questionnaire/current:
    get:
      summary: Get current questionnaire for a child
      security:
        - bearerAuth: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Current questionnaire
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentQuestionnaireResponse'

  /api/children/{childId}/questionnaire/answers/{questionCode}:
    put:
      summary: Submit answer for a question
      security:
        - bearerAuth: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: questionCode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAnswerRequest'
      responses:
        '200':
          description: Updated questionnaire
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentQuestionnaireResponse'

  /api/children/{childId}/questionnaire/complete:
    post:
      summary: Complete the questionnaire for a child
      security:
        - bearerAuth: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Questionnaire completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionnaireCompleteResponse'

security:
  - bearerAuth: []
