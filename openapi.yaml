openapi: 3.0.3
info:
  title: Kinloop API
  version: 1.0.0
  description: OpenAPI specification for Kinloop backend (generated from controllers and DTOs)
servers:
  - url: https://kinloop-be.onrender.com
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ChildId:
      name: childId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    UserRole:
      type: string
      enum: [PARENT, WORKSHOP, ADMIN]
    QuestionType:
      type: string
      enum: [SINGLE_CHOICE, MULTI_CHOICE, SCALE, FREE_TEXT, DATE]
    SessionStatus:
      type: string
      enum: [IN_PROGRESS, COMPLETED, ABANDONED]
    AgeBand:
      type: string
      enum: [BAND_0_12, BAND_12_24, BAND_24_48, BAND_48_72]
    Gender:
      type: string
      enum: [FEMALE, MALE, OTHER, UNDISCLOSED]
    TriggerReason:
      type: string
      enum: [INITIAL, AGE_BAND, MANUAL]

    HomeStatusResponse:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [new-user, feedback-required, returning-user]
        childId:
          type: integer
          format: int64
        childName:
          type: string
        latestActivity:
          $ref: '#/components/schemas/HomeActivityResponse'
        shouldGenerateDailyPlan:
          type: boolean
          description: When true, the client should offer navigation to the daily-plan /today flow.

    HomeActivityResponse:
      type: object
      required: [dailyPlanItemId, activityId, title, durationMinutes, slotType, feedbackSubmitted]
      properties:
        dailyPlanItemId:
          type: integer
          format: int64
        activityId:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
        slotType:
          type: string
          enum: [STRENGTHEN, DEVELOP, EXPLORE]
        intro:
          type: string
        purpose:
          type: string
        whyItMatters:
          type: string
        easierVariation:
          type: string
        harderVariation:
          type: string
        observationTip:
          type: string
        selectedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        feedbackSubmitted:
          type: boolean
        feedback:
          $ref: '#/components/schemas/HomeFeedbackResponse'

    HomeFeedbackResponse:
      type: object
      required: [feedbackId, feedbackType]
      properties:
        feedbackId:
          type: integer
          format: int64
        feedbackType:
          type: string
          enum: [LIKED, STRUGGLED, DISLIKED]
        resolvedReason:
          type: string
          enum: [SENSORY, INVOLVEMENT, INTEREST]
        freeText:
          type: string
        createdAt:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        role:
          $ref: '#/components/schemas/UserRole'

    RegisterResponse:
      type: object
      properties:
        message:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        deviceLabel:
          type: string

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        userId:
          type: integer
          format: int64
        emailVerified:
          type: boolean

    CreateChildRequest:
      type: object
      properties:
        fullName:
          type: string
          maxLength: 255
        birthDate:
          type: string
          format: date
        gender:
          $ref: '#/components/schemas/Gender'
        dailyTimeBudgetOptionCode:
          type: string
      required: [birthDate, dailyTimeBudgetOptionCode]

    DailyTimeBudgetOptionResponse:
      type: object
      required: [code, label, displayOrder, minMinutes, maxMinutes]
      properties:
        code:
          type: string
          enum: [A, B, C]
        label:
          type: string
        displayOrder:
          type: integer
        minMinutes:
          type: integer
        maxMinutes:
          type: integer

    DailyTimeBudgetProfileResponse:
      type: object
      required: [questionCode, question, selectedOptionCode, minMinutes, maxMinutes, options]
      properties:
        questionCode:
          type: string
        question:
          type: string
        selectedOptionCode:
          type: string
          enum: [A, B, C]
        minMinutes:
          type: integer
        maxMinutes:
          type: integer
        options:
          type: array
          description: A/B below 24 months; A/B/C from 24 months.
          items:
            $ref: '#/components/schemas/DailyTimeBudgetOptionResponse'

    UpdateDailyTimeBudgetRequest:
      type: object
      required: [optionCode]
      properties:
        optionCode:
          type: string
          enum: [A, B, C]

    DailyTimeBudgetResponse:
      type: object
      required: [answeredOptionCode, minMinutes, maxMinutes]
      properties:
        answeredOptionCode:
          type: string
          enum: [A, B, C]
        minMinutes:
          type: integer
        maxMinutes:
          type: integer

    OnboardingClosingAction:
      type: string
      enum: [START, REMIND_LATER]

    UpdateOnboardingClosingMessageRequest:
      type: object
      required: [action]
      properties:
        action:
          $ref: '#/components/schemas/OnboardingClosingAction'

    OnboardingClosingMessageResponse:
      type: object
      required: [shouldDisplay, planReminderEnabled, reminderPlansRemaining]
      properties:
        shouldDisplay:
          type: boolean
          description: True after questionnaire completion until the first response.
        planReminderEnabled:
          type: boolean
          description: True while REMIND_LATER covers one of the next three generated plans.
        reminderPlansRemaining:
          type: integer
          minimum: 0
          maximum: 3

    DailyPlanResponse:
      type: object
      required: [planId, childId, planDate, budgetMin, budgetMax, committedDurationMinutes,
                 totalDurationMinutes, fallbackLevel, activities, state, showOnboardingReminder]
      properties:
        planId:
          type: integer
          format: int64
        childId:
          type: integer
          format: int64
        planDate:
          type: string
          format: date
        budgetMin:
          type: integer
        budgetMax:
          type: integer
        committedDurationMinutes:
          type: integer
        totalDurationMinutes:
          type: integer
        fallbackLevel:
          type: integer
        activities:
          type: array
          items:
            type: object
        state:
          type: string
        message:
          type: string
          nullable: true
        showOnboardingReminder:
          type: boolean
          description: True only for the first three plans generated after REMIND_LATER.

    SessionSummaryResponse:
      type: object
      properties:
        sessionId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/SessionStatus'
        triggerReason:
          $ref: '#/components/schemas/TriggerReason'
        totalQuestions:
          type: integer
        answeredCount:
          type: integer
        nextQuestionCode:
          type: string

    CreateChildResponse:
      type: object
      properties:
        childId:
          type: integer
          format: int64
        fullName:
          type: string
        gender:
          $ref: '#/components/schemas/Gender'
        displayName:
          type: string
        birthDate:
          type: string
          format: date
        ageMonths:
          type: integer
        ageBand:
          $ref: '#/components/schemas/AgeBand'
        session:
          $ref: '#/components/schemas/SessionSummaryResponse'

    IdentityQuestionResponse:
      type: object
      properties:
        code:
          type: string
        displayOrder:
          type: integer
        body:
          type: string
        helperText:
          type: string
          nullable: true
        answerKey:
          type: string
        maxLength:
          type: integer
          nullable: true
        type:
          $ref: '#/components/schemas/QuestionType'
        required:
          type: boolean
        options:
          type: array
          items:
            $ref: '#/components/schemas/QuestionOptionResponse'
        answeredOptionCode:
          type: string
          nullable: true

    IdentityQuestionsResponse:
      type: object
      properties:
        questions:
          type: array
          items:
            $ref: '#/components/schemas/IdentityQuestionResponse'

    QuestionOptionResponse:
      type: object
      properties:
        code:
          type: string
        label:
          type: string
        displayOrder:
          type: integer

    QuestionnaireQuestionResponse:
      type: object
      properties:
        code:
          type: string
        body:
          type: string
        type:
          $ref: '#/components/schemas/QuestionType'
        required:
          type: boolean
        displayOrder:
          type: integer
        options:
          type: array
          items:
            $ref: '#/components/schemas/QuestionOptionResponse'
        answeredOptionCode:
          type: string
          nullable: true

    CurrentQuestionnaireResponse:
      type: object
      properties:
        sessionId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/SessionStatus'
        triggerReason:
          $ref: '#/components/schemas/TriggerReason'
        ageBand:
          $ref: '#/components/schemas/AgeBand'
        ageMonths:
          type: integer
        totalQuestions:
          type: integer
        answeredCount:
          type: integer
        nextQuestionCode:
          type: string
          nullable: true
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionnaireQuestionResponse'

    SubmitAnswerRequest:
      type: object
      required: [optionCode]
      properties:
        optionCode:
          type: string

    QuestionnaireCompleteResponse:
      type: object
      properties:
        sessionId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/SessionStatus'
        snapshotId:
          type: integer
          format: int64
        ageBand:
          $ref: '#/components/schemas/AgeBand'
        ageMonths:
          type: integer

paths:
  /api/home/status:
    get:
      summary: Get the authenticated parent's home state
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Home state resolved from onboarding, selection, and feedback history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeStatusResponse'
        '401':
          description: Missing, expired, or invalid access token

  /api/auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'

  /api/auth/verify:
    get:
      summary: Verify email with token
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/auth/login:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /api/children:
    post:
      summary: Create a child for current parent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChildRequest'
      responses:
        '201':
          description: Child created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChildResponse'

  /api/onboarding/identity-questions:
    get:
      summary: Get identity/onboarding questions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Identity questions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityQuestionsResponse'

  /api/children/{childId}/onboarding/daily-time-budget:
    get:
      summary: Get a child's budget range and age-appropriate choices
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChildId'
      responses:
        '200':
          description: Child budget and available choices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyTimeBudgetProfileResponse'
    put:
      summary: Set a child's budget during creation follow-up or re-onboarding
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChildId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDailyTimeBudgetRequest'
      responses:
        '200':
          description: Updated child budget range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyTimeBudgetResponse'
        '400':
          description: Unknown choice, or C selected below 24 months

  /api/children/{childId}/onboarding/closing-message:
    get:
      summary: Get the one-time closing-message and reminder state
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChildId'
      responses:
        '200':
          description: Current closing-message state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingClosingMessageResponse'
    put:
      summary: Record START or REMIND_LATER; the first response wins idempotently
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChildId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOnboardingClosingMessageRequest'
      responses:
        '200':
          description: Updated closing-message state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingClosingMessageResponse'

  /api/children/{childId}/daily-plan/today:
    get:
      summary: Get or generate today's persisted plan
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChildId'
      responses:
        '200':
          description: Today's plan, including the first-three-plan onboarding reminder flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyPlanResponse'
  /api/children/{childId}/questionnaire/current:
    get:
      summary: Get current questionnaire for a child
      security:
        - bearerAuth: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Current questionnaire
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentQuestionnaireResponse'

  /api/children/{childId}/questionnaire/answers/{questionCode}:
    put:
      summary: Submit answer for a question
      security:
        - bearerAuth: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: questionCode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAnswerRequest'
      responses:
        '200':
          description: Updated questionnaire
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentQuestionnaireResponse'

  /api/children/{childId}/questionnaire/complete:
    post:
      summary: Complete the questionnaire for a child
      security:
        - bearerAuth: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Questionnaire completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionnaireCompleteResponse'

security:
  - bearerAuth: []
