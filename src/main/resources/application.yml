spring:
  application:
    name: kinloop-be
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kinloop_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Qwe1asz}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
